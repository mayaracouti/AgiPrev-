[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "agipreve-api"
version = "0.1.0"
description = "API do protótipo demonstrativo não oficial AgiPrevê"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "SQLAlchemy>=2.0.40,<2.1",
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a dedicated PostgreSQL test database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
