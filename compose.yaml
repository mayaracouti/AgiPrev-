name: agipreve
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agipreve}
      POSTGRES_USER: ${POSTGRES_USER:-agipreve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build: ./backend
    environment: &api_environment
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agipreve}:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-agipreve}
      APP_ENV: development
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Configure DEMO_PASSWORD in .env}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8081","http://localhost:19006"]}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  seed:
    build: ./backend
    environment: *api_environment
    command: ["python", "-m", "app.seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build: ./backend
    environment: *api_environment
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/tests:/app/tests:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
